[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicpulse"
version = "0.1.0"
description = "Pakistan CivicPulse - live public issue intelligence (warehouse + data quality agent)"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.1",
  "pyarrow>=14",
  "pandera>=0.20",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
