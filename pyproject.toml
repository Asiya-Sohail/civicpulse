[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicpulse"
version = "0.1.0"
description = "CivicPulse Pakistan civic-issue news warehouse and data-quality pipeline"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "scipy>=1.10",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pyarrow>=14.0",
  "pandera[pandas]>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
