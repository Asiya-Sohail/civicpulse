name: CivicPulse Hourly Pipeline

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civicpulse-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore cached warehouse state
        uses: actions/cache@v4
        with:
          path: |
            data/bronze
            data/cache
            data/warehouse
            logs
          key: civicpulse-data-${{ github.run_id }}
          restore-keys: |
            civicpulse-data-

      - name: Run CivicPulse pipeline
        run: make data

      - name: Save warehouse state for next run
        uses: actions/cache@v4
        if: always()
        with:
          path: |
            data/bronze
            data/cache
            data/warehouse
            logs
          key: civicpulse-data-${{ github.run_id }}
