name: CivicPulse Hourly Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civicpulse-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run CivicPulse pipeline
        env:
          NEWSAGENT_API_KEY: ${{ secrets.NEWSAGENT_API_KEY }}
        run: make data
