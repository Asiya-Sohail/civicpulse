name: CivicPulse Hourly Pipeline

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civicpulse-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore cached warehouse state
        id: warehouse-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bronze
            data/cache
            data/warehouse
            data/manifest.csv
            logs
          key: civicpulse-data-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            civicpulse-data-${{ github.ref_name }}-
            civicpulse-data-

      - name: Backfill historical GDELT and build it to Gold
        if: ${{ !hashFiles('data/warehouse/.gdelt-history-complete-v5') }}
        run: |
          python -m civicpulse backfill
          test -f data/warehouse/.gdelt-history-complete-v5

      - name: Run CivicPulse pipeline
        run: make data

      - name: Save warehouse state for next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/bronze
            data/cache
            data/warehouse
            data/manifest.csv
            logs
          key: civicpulse-data-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
